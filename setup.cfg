[metadata]
license_file = LICENSE

[options]
zip_safe = False
include_package_data = True

[options.packages.find]
where = src
include = wireflux*

[options.extras_require]
dev =
    pytest
    pytest-cov
    black
    isort
    flake8

viz =
    mayavi
    pyvista

[flake8]
max-line-length = 120
ignore = E203, W503

[tool:pytest]
testpaths = tests
addopts = --maxfail=1 -q
